<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat tiles · TagKit preview</title>
<meta name="description" content="a row of key numbers with a change for each. A &lt;dl&gt; whose items are wrapped in &lt;div&gt;s becomes tiles.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tagbrush@1/tagbrush.min.css">
<script src="https://cdn.jsdelivr.net/npm/tagaction@0/tagaction.min.js" defer></script>
</head>
<body>
<main>
<h1>Stat tiles</h1>
<dl>
  <div><dt>Revenue</dt><dd>$84,312</dd><dd><ins>+12.4%</ins> vs. last month</dd></div>
  <div><dt>Orders</dt><dd>1,148</dd><dd><ins>+3.1%</ins> vs. last month</dd></div>
  <div><dt>Conversion</dt><dd>2.9%</dd><dd><del>−0.4%</del> vs. last month</dd></div>
  <div><dt>Average order</dt><dd>$73.44</dd><dd><ins>+8.9%</ins> vs. last month</dd></div>
</dl>
</main>
</body>
</html>
