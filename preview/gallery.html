<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo gallery · TagKit preview</title>
<meta name="description" content="linked photos in a grid of figures. TagAction opens a photo in a viewer and steps through the section's photos with Previous, Next, and the arrow keys; without JavaScript each link opens the full-size photo.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tagbrush@2/tagbrush.min.css">
<script src="https://cdn.jsdelivr.net/npm/tagaction@0/tagaction.min.js" defer></script>
</head>
<body>
<main>
<h1>Photo gallery</h1>
<section>
  <h2>From the workshop</h2>
  <div class="grid" style="--grid-min-column: 12rem">
    <figure>
      <a href="https://picsum.photos/id/1060/1600/1200.jpg"><img src="https://picsum.photos/id/1060/600/450.jpg" alt="A barista pouring milk into a cup" width="600" height="450" loading="lazy"></a>
      <figcaption>Morning pour</figcaption>
    </figure>
    <figure>
      <a href="https://picsum.photos/id/1080/1600/1200.jpg"><img src="https://picsum.photos/id/1080/600/450.jpg" alt="Strawberries in a bowl on a wooden table" width="600" height="450" loading="lazy"></a>
      <figcaption>Market haul</figcaption>
    </figure>
    <figure>
      <a href="https://picsum.photos/id/1073/1600/1200.jpg"><img src="https://picsum.photos/id/1073/600/450.jpg" alt="A row of books on a shelf" width="600" height="450" loading="lazy"></a>
      <figcaption>The reading shelf</figcaption>
    </figure>
    <figure>
      <a href="https://picsum.photos/id/1067/1600/1200.jpg"><img src="https://picsum.photos/id/1067/600/450.jpg" alt="A city street at dusk" width="600" height="450" loading="lazy"></a>
      <figcaption>Walk home</figcaption>
    </figure>
  </div>
</section>
</main>
</body>
</html>
