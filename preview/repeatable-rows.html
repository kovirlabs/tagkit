<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repeatable rows · TagKit preview</title>
<meta name="description" content="a form where people add as many rows as they need and remove any of them (TagAction's --clone and --remove). Without JavaScript the first row still works and the Add and Remove buttons stay hidden.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tagbrush@1/tagbrush.min.css">
<script src="https://cdn.jsdelivr.net/npm/tagaction@0/tagaction.min.js" defer></script>
</head>
<body>
<main>
<h1>Repeatable rows</h1>
<form action="/expenses" method="post">
  <fieldset>
    <legend>Expenses</legend>
    <ol>
      <li id="expense">
        <div role="group">
          <input name="what" aria-label="What it was for" placeholder="What it was for" required>
          <input type="number" name="amount" aria-label="Amount in dollars" placeholder="Amount" min="0" step="0.01" required>
          <button type="button" class="outline" data-tone="error" commandfor="expense" command="--remove" hidden>Remove</button>
        </div>
      </li>
      <template id="new-expense">
        <li id="expense">
          <div role="group">
            <input name="what" aria-label="What it was for" placeholder="What it was for" required>
            <input type="number" name="amount" aria-label="Amount in dollars" placeholder="Amount" min="0" step="0.01" required>
            <button type="button" class="outline" data-tone="error" commandfor="expense" command="--remove" hidden>Remove</button>
          </div>
        </li>
      </template>
    </ol>
  </fieldset>
  <div role="group">
    <button type="button" class="secondary" commandfor="new-expense" command="--clone" hidden>Add expense</button>
    <button>Submit report</button>
  </div>
</form>
</main>
</body>
</html>
