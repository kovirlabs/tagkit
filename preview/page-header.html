<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page header · TagKit preview</title>
<meta name="description" content="a title and subtitle with action buttons on the same row. Put it first in &lt;main&gt;.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tagbrush@1/tagbrush.min.css">
<script src="https://cdn.jsdelivr.net/npm/tagaction@0/tagaction.min.js" defer></script>
</head>
<body>
<main>
<h1>Page header</h1>
<header>
  <hgroup>
    <h1>Orders</h1>
    <p>1,148 orders this month</p>
  </hgroup>
  <div role="group">
    <a class="button outline" href="/orders.csv">Export CSV</a>
    <a class="button" href="/orders/new">New order</a>
  </div>
</header>
</main>
</body>
</html>
