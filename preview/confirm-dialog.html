<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm dialog · TagKit preview</title>
<meta name="description" content="a button opens a modal with no page script (commandfor/command); clicking the backdrop, Escape, or Cancel closes it.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tagbrush@1/tagbrush.min.css">
<script src="https://cdn.jsdelivr.net/npm/tagaction@0/tagaction.min.js" defer></script>
</head>
<body>
<main>
<h1>Confirm dialog</h1>
<button class="secondary" commandfor="delete-project" command="show-modal">Delete project</button>
<dialog id="delete-project">
  <form method="post" action="/projects/42/delete">
    <header>
      <h2>Delete "Website redesign"?</h2>
      <button type="button" commandfor="delete-project" command="close" aria-label="Close">✕</button>
    </header>
    <p>This deletes the project and its 128 time entries. It can't be undone.</p>
    <footer>
      <button type="button" class="secondary" commandfor="delete-project" command="close">Cancel</button>
      <button>Delete project</button>
    </footer>
  </form>
</dialog>
</main>
</body>
</html>
