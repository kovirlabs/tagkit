<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callouts · TagKit preview</title>
<meta name="description" content="highlighted notes inside an article. A bold first word labels them; data-tone colors them.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tagbrush@1/tagbrush.min.css">
<script src="https://cdn.jsdelivr.net/npm/tagaction@0/tagaction.min.js" defer></script>
</head>
<body>
<main>
<h1>Callouts</h1>
<article>
  <h2>Before you deploy</h2>
  <p>Check that your environment variables are set in the dashboard.</p>
  <aside><strong>Note:</strong> Changes to variables take effect on the next deploy.</aside>
  <aside data-tone="warning"><strong>Warning:</strong> Deleting a variable can break a running site.</aside>
</article>
</main>
</body>
</html>
