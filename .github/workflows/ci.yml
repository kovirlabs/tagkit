name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check generated files are up to date
        run: |
          npm run build
          git diff --exit-code || (echo "::error::Generated files are out of date. Run 'npm run build' and commit the result." && exit 1)

      - name: Install Pandoc (for the Pandoc template tests)
        run: sudo apt-get update && sudo apt-get install -y pandoc
        timeout-minutes: 5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the MkDocs theme example
        run: sh themes/mkdocs/build-example.sh

      - name: Build the Hugo theme example
        run: docker run --rm -v "$PWD/themes":/themes -w /themes/hugo --entrypoint sh ghcr.io/gohugoio/hugo:latest build-example.sh

      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5

      # TagCheck (static and --browser), TagAction behaviors, no-JS, and catalog checks.
      - run: npx playwright test
